name = "eclipse-discord-bot"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Discord application credentials — set these as SECRETS (not vars):
#   wrangler secret put DISCORD_PUBLIC_KEY
#   wrangler secret put DISCORD_BOT_TOKEN
#   wrangler secret put DISCORD_APPLICATION_ID
# Or via Cloudflare dashboard → Worker → Settings → Variables and Secrets

# Your Eclipse addon manifest URLs (with token paths).
# These are the full URLs that end in /manifest.json
# The bot strips /manifest.json and uses the base for /search, /stream, etc.
[vars]
MONOCHROME_URL = "https://monochrome.rickyaddons.dpdns.org/u/8fbda2f7515bcd0c88729198695e~~~SElNQVg/manifest.json"
QOBUZ_TIDAL_URL = "https://qobuz-tidal-eclipse.cyrusna29.workers.dev/u/wh4g2a1rxm2gugcfazlnwagkm57e/manifest.json"

# Which addon to prefer when both have a match
PREFERRED_SOURCE = "monochrome"
