name = "eclipse-discord-bot"
main = "src/index.js"
compatibility_date = "2024-12-01"

# Discord application credentials — set these first
# Get them from https://discord.com/developers/applications -> your app -> General
#   DISCORD_PUBLIC_KEY  : Public Key (shown on the General tab)
#   DISCORD_BOT_TOKEN   : Bot token (Bot tab -> Reset Token)
#   DISCORD_APPLICATION_ID : Application ID (General tab -> App ID)
#
# Set via:  wrangler secret put DISCORD_PUBLIC_KEY
#           wrangler secret put DISCORD_BOT_TOKEN
#           wrangler secret put DISCORD_APPLICATION_ID

# Your deployed Eclipse addon instances (used as the music backends)
[vars]
MONOCHROME_URL = "https://monochrome.rickyaddons.dpdns.org"
QOBUZ_TIDAL_URL = "https://qobuz-tidal-eclipse.cyrusna29.workers.dev"

# Which addon to prefer when both have a match (monochrome or qobuz-tidal)
PREFERRED_SOURCE = "monochrome"
